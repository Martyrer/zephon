  --window-shadow: 0 28px 70px rgba(18, 30, 60, 0.30), 0 2px 8px rgba(18, 30, 60, 0.12);
  --window-edge: rgba(0, 0, 0, 0.14);
  color-scheme: light;
}
.theme-dark {
  --ink: #F1F3F6;
  --ink-2: #A9AFBB;
  --ink-3: #6F7682;
  --lagoon: #5CC8D6;
  --lagoon-hover: #79D4E0;
  --on-lagoon: #062A31;
  --amber: #F0B455;
  --red: #FF9494;

  --mica: rgba(27, 30, 37, 0.80);
  --layer-1: rgba(255, 255, 255, 0.040);
  --layer-2: rgba(255, 255, 255, 0.075);
  --control: rgba(255, 255, 255, 0.065);
  --stroke: rgba(255, 255, 255, 0.075);
  --stroke-strong: rgba(255, 255, 255, 0.15);
  --track: rgba(255, 255, 255, 0.30);
  --thumb: #454B56;
  --amber-wash: rgba(240, 180, 85, 0.10);
  --red-wash: rgba(255, 148, 148, 0.09);
  --window-shadow: 0 28px 70px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);
  --window-edge: rgba(255, 255, 255, 0.10);
  color-scheme: dark;
}

/* ---------- page (not part of the app) ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #C9CDD3;
  font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  color: #23262c;
  -webkit-font-smoothing: antialiased;
}
.board { width: 1440px; padding: 36px 40px 48px; }
.board-head { display: flex; align-items: baseline; gap: 16px; margin: 0 0 22px 4px; }
.board-head h1 { font: 600 20px/28px "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 0; }
.board-head p { margin: 0; font-size: 14px; color: #4b5059; }
.scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.scene {
  position: relative; margin: 0; height: 960px; border-radius: 6px; overflow: hidden;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 56px;
}
.note { font-size: 13px; line-height: 18px; color: #4b5059; margin: 10px 4px 0; max-width: 64ch; }
.scene .tag {
  position: absolute; left: 16px; bottom: 14px; font-size: 13px;
  padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.55); color: #23262c;
}
.scene.dark-wall .tag { background: rgba(0,0,0,.45); color: #e8eaee; }

/* simulated wallpapers (the OS material samples these) */
.wall { position: absolute; inset: 0; }
.light-wall .wall {
  background:
    radial-gradient(38% 30% at 22% 26%, #7FB2FF 0%, transparent 70%),
    radial-gradient(34% 34% at 84% 70%, #FFB98F 0%, transparent 72%),
    radial-gradient(30% 26% at 70% 14%, #C2A8FF 0%, transparent 70%),
    radial-gradient(40% 30% at 18% 86%, #8FE3D2 0%, transparent 70%),
    linear-gradient(160deg, #E4EAF3, #D5DCE8);
}
.dark-wall .wall {
  background:
    radial-gradient(36% 30% at 20% 24%, #1F5FA8 0%, transparent 70%),
    radial-gradient(34% 34% at 86% 72%, #6B2F6A 0%, transparent 72%),
    radial-gradient(30% 26% at 74% 12%, #2D3E8C 0%, transparent 70%),
    radial-gradient(40% 30% at 14% 88%, #0F6B66 0%, transparent 70%),
    linear-gradient(160deg, #101827, #0B1220);
}
/* hard-edged wallpaper shapes, so the material's blur is visible */
.wall i { position: absolute; border-radius: 50%; }
.light-wall .wall i:nth-child(1) { width: 260px; height: 260px; left: 36px; top: 300px; background: #3D7BEA; }
.light-wall .wall i:nth-child(2) { width: 190px; height: 190px; right: 28px; top: 120px; background: #F08A5D; }
.dark-wall .wall i:nth-child(1) { width: 260px; height: 260px; left: 36px; top: 300px; background: #2A73D9; }
.dark-wall .wall i:nth-child(2) { width: 190px; height: 190px; right: 28px; top: 120px; background: #B04A9A; }

/* ---------- window ---------- */
.window {
  position: relative; width: 560px; border-radius: 8px; overflow: hidden;
  background: var(--mica);
  /* the only backdrop-filter on the page: stands in for the OS Mica material */
  backdrop-filter: blur(60px) saturate(1.6);
  box-shadow: var(--window-shadow), 0 0 0 1px var(--window-edge);
  color: var(--ink);
  font-size: 14px; line-height: 20px;
}
.window.narrow { width: 380px; }

.titlebar { height: 40px; display: flex; align-items: center; padding-left: 14px; }
.titlebar .glyph { width: 16px; height: 16px; color: var(--lagoon); flex: none; }
.titlebar .title { font-size: 12px; line-height: 16px; margin-left: 10px; color: var(--ink); }
.titlebar .spacer { flex: 1; }
.caption-btn {
  width: 46px; height: 40px; display: grid; place-items: center; color: var(--ink);
}
.caption-btn svg { width: 10px; height: 10px; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; color: var(--ink-2);
}
.icon-btn svg { width: 16px; height: 16px; }
.titlebar .icon-btn { margin-right: 4px; }

.content { padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 18px; }

.field-label { font-size: 12px; line-height: 16px; color: var(--ink-2); margin-bottom: 6px; display: flex; justify-content: space-between; }

/* select */
.select {
  height: 32px; display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 11px; border-radius: 4px;
  background: var(--control);
  border: 1px solid var(--stroke); border-bottom-color: var(--stroke-strong);
  color: var(--ink); white-space: nowrap; min-width: 0;
}
.select .value { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.select .sub { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.select svg { width: 12px; height: 12px; color: var(--ink-2); flex: none; }
.select .lead { width: 16px; height: 16px; color: var(--ink-2); }
.select.locked { background: transparent; border-color: var(--stroke); }
.select.locked .value { color: var(--ink); }

/* rooms */
.rooms-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.rooms-head h2 { margin: 0; font: 600 14px/20px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
.rooms-head .icon-btn { width: 28px; height: 28px; margin-right: -6px; }

.rooms {
  border-radius: 8px; overflow: hidden;
  background: var(--layer-1);
  border: 1px solid var(--stroke);
}
.room { padding: 12px 14px; }
.room + .room { border-top: 1px solid var(--stroke); }
.room.on { background: var(--layer-2); }
.room-head { display: flex; align-items: center; gap: 12px; min-height: 22px; }
.room-id { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; }
.room-name { font: 600 15px/22px "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", sans-serif; letter-spacing: -0.005em; }
.room-meta { font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; }
.room-meta .ip { color: var(--ink-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
.room.offline .room-name { color: var(--ink-3); }
.state { font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.state.playing { color: var(--lagoon); }
.state.offline { color: var(--ink-3); font-weight: 400; }
.state.error { color: var(--red); }

.controls { display: flex; align-items: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
.vol { flex: 1 1 200px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.vol > svg { width: 16px; height: 16px; color: var(--ink-2); flex: none; }
.vol .num { width: 26px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.controls .select { flex: 0 0 176px; }
.narrow .controls .select { flex: 1 1 100%; }

/* slider */
.slider { position: relative; flex: 1; height: 20px; min-width: 80px; }
.slider .rail { position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: 2px; background: var(--track); }
.slider .fill { position: absolute; left: 0; top: 8px; height: 4px; border-radius: 2px; background: var(--lagoon); width: calc(var(--v) * 1%); }
.slider .thumb {
  position: absolute; top: 0; width: 20px; height: 20px; border-radius: 50%;
  left: calc(var(--v) * 1% - var(--v) * 0.2px);
  background: var(--thumb); border: 1px solid var(--stroke-strong);
  box-shadow: 0 1px 2px rgba(0,0,0,.16);
  display: grid; place-items: center;
}
.slider .thumb::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--lagoon); }

/* switch */
.switch {
  width: 40px; height: 20px; border-radius: 10px; flex: none; position: relative;
  border: 1px solid var(--track); background: transparent;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 4px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--ink-2);
}
.switch.on { background: var(--lagoon); border-color: var(--lagoon); }
.switch.on::after { left: 23px; background: var(--on-lagoon); }

.room-foot { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; display: flex; gap: 12px; flex-wrap: wrap; }
.room-foot .lost { color: var(--amber); font-weight: 600; }
.hint {
  margin-top: 8px; display: flex; align-items: center; gap: 12px;
  padding: 6px 6px 6px 10px; border-radius: 4px; background: var(--amber-wash);
  font-size: 12px; line-height: 16px; color: var(--ink);
}
.hint p { margin: 0; flex: 1; }
.hint b { color: var(--amber); font-weight: 600; }
.room-error {
  margin-top: 8px; padding: 6px 10px; border-radius: 4px; background: var(--red-wash);
  font-size: 12px; line-height: 16px; color: var(--ink);
}
.room-error b { color: var(--red); font-weight: 600; }

/* buttons */
.btn {
  height: 32px; padding: 0 14px; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; line-height: 20px; white-space: nowrap; flex: none;
  background: var(--control); color: var(--ink);
  border: 1px solid var(--stroke); border-bottom-color: var(--stroke-strong);
}
.btn svg { width: 14px; height: 14px; }
.btn.primary { background: var(--lagoon); color: var(--on-lagoon); border-color: transparent; font-weight: 600; }
.btn.small { height: 24px; padding: 0 10px; font-size: 12px; line-height: 16px; }
.btn.wide { min-width: 112px; justify-content: center; }

/* banner */
.banner {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px 8px 12px; border-radius: 6px;
  background: var(--amber-wash); border: 1px solid var(--stroke);
  font-size: 12px; line-height: 16px;
}
.banner > svg { width: 16px; height: 16px; color: var(--amber); flex: none; }
.banner p { margin: 0; flex: 1; }
.banner.full { align-items: flex-start; padding: 14px 14px 14px 14px; gap: 12px; font-size: 14px; line-height: 20px; }
.banner.full > svg { margin-top: 2px; }
.banner.full h3 { margin: 0 0 2px; font: 600 14px/20px "Segoe UI Variable Text", "Segoe UI", sans-serif; }
.banner.full p { color: var(--ink-2); }
.banner.full .actions { display: flex; align-items: center; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }

/* ---------- footer: transport + lag line ---------- */
.footer { background: var(--layer-1); border-top: 1px solid var(--stroke); padding: 14px 16px 16px; }
.lag { position: relative; height: 82px; margin: 0 2px; }
.lag .rail { position: absolute; left: 0; right: 0; top: 37px; height: 1px; background: var(--stroke-strong); }
.lag .run { position: absolute; left: 0; top: 36px; height: 3px; border-radius: 2px; width: calc(var(--x) * 1%); background: linear-gradient(90deg, var(--stroke-strong), var(--lagoon)); }
.lag .run.planned { background: var(--track); opacity: .6; }
.lag .tick { position: absolute; top: 33px; width: 1px; height: 9px; background: var(--track); left: calc(var(--x) * 1%); }
.lag .origin { position: absolute; left: 0; top: 28px; width: 2px; height: 19px; border-radius: 1px; background: var(--ink); }
.lag .origin-label { position: absolute; left: 0; top: 54px; font-size: 12px; line-height: 16px; color: var(--ink-2); white-space: nowrap; }
.lag .mark { position: absolute; left: calc(var(--x) * 1%); top: 0; height: 82px; }
.lag .dot {
  position: absolute; left: -7px; top: 31px; width: 15px; height: 15px; border-radius: 50%;
  background: var(--lagoon); border: 3px solid var(--thumb);
  box-shadow: 0 0 0 1px var(--stroke-strong);
}
.lag .dot.hollow { background: var(--thumb); border: 2px solid var(--ink-3); box-shadow: none; }
.lag .ms {
  position: absolute; top: 0; left: 0; transform: translateX(-50%);
  font: 600 20px/24px "Segoe UI Variable Display", "Segoe UI", sans-serif; letter-spacing: -0.01em;
  color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.lag .ms small { font: 400 12px/16px "Segoe UI Variable Small", "Segoe UI", sans-serif; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.lag .mark.end .ms { transform: translateX(calc(-100% + 10px)); }
.lag .stopped .ms { color: var(--ink-2); }
.lag .names, .lag .names-end { position: absolute; top: 52px; font-size: 12px; line-height: 15px; white-space: nowrap; color: var(--ink); }
.lag .names { left: -7px; }
.lag .names-end { right: 0; text-align: right; }
.lag .names span, .lag .names-end span { display: block; }
.lag .warn { color: var(--amber); }
.lag-caption { margin: 4px 0 14px; font-size: 12px; line-height: 16px; color: var(--ink-2); }
.transport { display: flex; align-items: center; gap: 12px; }
.transport .summary { flex: 1; color: var(--ink-2); }
.transport .summary b { color: var(--ink); font-weight: 600; }

/* ---------- specimens ---------- */
.specimens { display: grid; grid-template-columns: 460px 1fr; gap: 24px; margin-top: 24px; }
.spec-col { display: flex; flex-direction: column; gap: 24px; }
.spec { position: relative; border-radius: 6px; overflow: hidden; padding: 28px; display: flex; justify-content: center; align-items: flex-start; }
.spec > .wall { z-index: 0; }
.spec > :not(.wall):not(.tag) { position: relative; z-index: 1; }
.spec .tag {
  position: absolute; left: 14px; bottom: 12px; font-size: 13px; z-index: 2;
  padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.55); color: #23262c;
}
.spec.dark-wall .tag { background: rgba(0,0,0,.45); color: #e8eaee; }
.panel {
  border-radius: 8px; overflow: hidden; background: var(--mica);
  backdrop-filter: blur(60px) saturate(1.6);
  box-shadow: var(--window-shadow), 0 0 0 1px var(--window-edge); color: var(--ink);
  font-size: 14px; line-height: 20px;
}
.menu { width: 340px; padding: 4px; }
.menu-item { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 4px; position: relative; }
.menu-item .sub { color: var(--ink-3); font-size: 12px; margin-left: auto; }
.menu-item.selected { background: var(--layer-2); }
.menu-item.selected::before { content: ""; position: absolute; left: 0; top: 10px; width: 3px; height: 16px; border-radius: 2px; background: var(--lagoon); }
.menu-item .muted { color: var(--ink-2); }
.theme-row { display: flex; gap: 16px; align-items: center; padding: 14px 16px; }
.theme-row .pair { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); }
.theme-row .icon-btn { background: var(--control); border: 1px solid var(--stroke); color: var(--ink); }
.type-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.type-compare > div { padding: 16px 18px; }
.type-compare > div + div { border-left: 1px solid var(--stroke); }
.type-compare .who { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
.type-compare .n { font-weight: 600; font-size: 15px; line-height: 22px; }
.type-compare .m { font-size: 12px; line-height: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.type-compare .fx { font-family: "Fixel Specimen", sans-serif; }
</style>
</head>

              <div class="room on">
