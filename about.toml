# cargo-about configuration: the licenses accepted in the dependency tree. The release
# workflow renders about.hbs into THIRD-PARTY-LICENSES.html and ships it with the exe.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Notices the crate manifests do not carry. cargo-about checks each file's checksum, so a
# dependency bump that changes one fails the release build until it is looked at again.

# gpui-kit's icons are Lucide (ISC) and, for some icons, Feather (MIT); the crate itself is
# Apache-2.0 and ships those notices in a separate file.
[gpui-kit-assets.clarify]
license = "Apache-2.0 AND ISC AND MIT"

[[gpui-kit-assets.clarify.files]]
path = "LICENSE-LUCIDE"
license = "ISC AND MIT"
checksum = "b495047bd93a9b06913511076f504daba17d5bbeb3e0650f3bb53a4220329c57"

# Nyx-Refrain keeps its copyright notice at the repository root, outside the crate.
[raop.clarify]
license = "MIT"

[[raop.clarify.git]]
path = "LICENSE"
license = "MIT"
checksum = "c50f49028bec7d44e3251a96ee9dcb4bf7164deda10a50756f568d80bfa4f584"

