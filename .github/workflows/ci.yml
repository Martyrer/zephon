name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs (tag in the comment); Dependabot proposes updates.
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build release
        run: cargo build --locked --release
      # A release build checks the frame times against the hard limits in AGENTS.md, and prints
      # them. It comes after the release build to reuse its dependencies.
      - name: Frame times
        run: cargo test --locked --release ui::perf -- --nocapture

  # The oldest Rust that builds the committed Cargo.lock; keep in step with rust-version in
  # Cargo.toml.
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check
        run: cargo check --locked --all-targets
