name: Release

# Publishes a release when a push to main brings a version with no tag yet and a dated
# changelog section: `version` in Cargo.toml and `## [<version>] - YYYY-MM-DD` in CHANGELOG.md.
# The job builds the exe, tags v<version> on that commit and uses the section as the notes.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, CHANGELOG.md]
  # Retries a release whose tag was never made, for example after a failed build.
  workflow_dispatch:

permissions:
  contents: read

# Two version bumps in a row must not race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# The check and build jobs run with a read-only token and no cache; only the publish job, which
# runs no project code, can write to the repository.
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # --exit-code: 0 when the tag exists, 2 when it does not, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || status=$?
          case $status in
            0) echo "v$version is already released."; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            2) ;;
            *) exit "$status" ;;
          esac
          heading=$(grep -m1 -F "## [$version]" CHANGELOG.md || true)
          if [ -z "$heading" ]; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section. Move the [Unreleased] notes under it."
            exit 1
          fi
          # The date in the heading is the go-ahead: `## [0.2.0] - unreleased` does not ship yet.
          if [[ "$heading" =~ ^"## [$version] - "[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice file=CHANGELOG.md::v$version is not released: its heading has no date ($heading)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The lines between `## [<version>]` and the next `## [` heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::The '## [$VERSION]' section has no notes."
            exit 1
          fi
      - if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          if-no-files-found: error

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release
      - name: Install cargo-about
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Third-party licenses
        run: cargo about generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.html
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          $dir = "zephon-$env:VERSION-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target\release\zephon.exe, README.md, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-LICENSES.html $dir
          Compress-Archive -Path "$dir\*" -DestinationPath "$dir.zip"
          (Get-FileHash "$dir.zip" -Algorithm SHA256).Hash.ToLower() + "  $dir.zip" | Out-File -Encoding ascii "$dir.zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            zephon-*.zip
            zephon-*.zip.sha256
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      # gh uploads the files to a draft and publishes it only once all are there, so the release
      # never shows up without its zip.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          flags=()
          # A version such as 0.2.0-beta is a prerelease.
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "v$VERSION" zephon-*.zip zephon-*.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Zephon $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
